[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optbt"
version = "0.1.0"
description = "A modular options-strategy backtesting engine with simulated markets and realistic execution costs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["optbt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
